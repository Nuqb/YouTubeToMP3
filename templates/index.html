<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101214">
    <meta name="description" content="Convert a YouTube, YouTube Music, SoundCloud, Spotify, or Beatstars link to MP3.">
    <title>YouTube to MP3</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101214'/%3E%3Cpath d='m8 10 6 6-6 6m10 0h6' fill='none' stroke='%23f09cbd' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='3') }}">
    <script src="{{ url_for('static', filename='script.js', v='3') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="/" aria-label="YouTube to MP3 home"><span class="brand-icon" aria-hidden="true">&gt;_</span><span>YouTube to MP3</span></a>
        <a class="source-link" href="https://github.com/Nuqb/youtubeToMP3" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.72-1.5-2.5-.29-5.13-1.25-5.13-5.57 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.63 0c2.15-1.46 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.33-2.63 5.28-5.14 5.56.4.35.76 1.03.76 2.08v3.1c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
            <span>Source</span><span aria-hidden="true">↗</span>
        </a>
    </header>
    <main>
        <section class="workspace" aria-labelledby="page-title">
            <div class="intro">
                <h1 id="page-title">YouTube to MP3</h1>
                <span class="output-format">.mp3 <span aria-hidden="true">/</span> 192 kbps</span>
            </div>
            <div class="converter-box">
                <form id="convert-form" novalidate>
                    <div class="form-body">
                        <label for="youtube-url">Source URL</label>
                        <div class="input-row">
                            <div class="url-field">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m10 13 4-4m-6 6-1 1a4.24 4.24 0 0 1-6-6l4-4a4.24 4.24 0 0 1 6 0m2 2 1-1a4.24 4.24 0 0 1 6 6l-4 4a4.24 4.24 0 0 1-6 0" transform="translate(1 1)"/></svg>
                                <input type="url" id="youtube-url" name="url" placeholder="Paste a track or video link..." autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="supported-sources" required>
                            </div>
                            <button id="convert-btn" type="submit">
                                <span id="loading-spinner" class="spinner" hidden aria-hidden="true"></span>
                                <span id="btn-text">Convert</span>
                                <svg class="button-arrow" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
                            </button>
                        </div>
                        <div class="options">
                            <button type="button" id="artist-toggle" class="options-toggle" aria-expanded="false" aria-controls="artist-options"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>Artist / producer<span class="optional">optional</span></button>
                            <div id="artist-options" class="options-content" inert>
                                <div class="options-clip">
                                    <div class="options-body">
                                        <label for="artist-name">Artist / producer</label>
                                        <input type="text" id="artist-name" name="artist" placeholder="e.g. artist or producer name" aria-describedby="artist-hint" autocomplete="off">
                                        <p id="artist-hint">Helps find the right track on Beatstars.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="result-section" class="result-section" role="status" hidden>
                            <div class="result-copy"><p class="result-label">Your file is ready</p><h2 id="video-title"></h2></div>
                            <a id="download-link" href="#" class="download-btn">Download .mp3 <span aria-hidden="true">↓</span></a>
                        </div>
                        <div id="error-section" class="error-section" role="alert" hidden><p id="error-message"></p></div>
                    </div>
                </form>
            </div>
            <div id="supported-sources" class="supported-sources">
                <ul aria-label="Supported platforms"><li>YouTube</li><li>YouTube Music</li><li>SoundCloud</li><li>Spotify</li><li>Beatstars</li></ul>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p>For personal use. Respect creators and their work.</p>
        <a href="https://github.com/Nuqb" target="_blank" rel="noopener noreferrer">Built by <span>@Nuqb</span> <span aria-hidden="true">↗</span></a>
    </footer>
</body>
</html>
